<!DOCTYPE html>
<html>
  <head>
    <title>CS460 - Hello Cube</title>
    <style>
      html, body {
        background-color: #000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <!-- Include the XTK Library -->
    <script type="text/javascript" src="https://goxtk.com"></script>
  </head>
  <body>
    <script type="text/javascript">
      window.onload = function() {
        // Create and initialize the 3D renderer inside the body
        var r = new X.renderer3D();
        r.init();

        // Create a basic 3D cube mesh object
        var cube = new X.cube();
        
        // Add the cube to the scene and render it
        r.add(cube);
        r.render();
      };
    </script>
  </body>
</html>
